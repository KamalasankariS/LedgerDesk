name: Feature Request
description: Suggest a new feature for LedgerDesk
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative approaches you've considered.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - API
        - Frontend
        - Agent Pipeline
        - Retrieval
        - Infrastructure
        - Other
